# .streamlit/config.toml — Streamlit 서버 설정
# 레포 루트의 .streamlit/ 폴더에 두면 Community Cloud 가 배포 시 자동으로 읽는다.
#
# disconnectedSessionTTL: 웹소켓이 끊긴 세션을 서버가 보관하는 시간(초). 기본 120.
#   PC 에서 잠깐 다른 탭을 보다 돌아오는 경우처럼 "브라우저가 페이지를 유지한 채
#   웹소켓만 재연결"되는 상황을 커버한다. 모바일에서 페이지 자체가 파기되는 경우는
#   이 값으로 못 막으며, app.py 의 자동 로그인 쿠키(stk_auth)가 담당한다.
#   ※ Community Cloud 가 일부 server.* 옵션을 자체 값으로 덮어쓸 수 있어
#      실제 반영 여부는 배포 후 체감으로 확인 필요.

[server]
disconnectedSessionTTL = 1800
