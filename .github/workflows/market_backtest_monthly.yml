name: 🔬 월간 신호 백테스트 (Signal Backtest)

on:
  repository_dispatch:
    types: [trigger-backtest-monthly]   # Cloud Scheduler → GitHub API로 트리거 (월 1회)
  workflow_dispatch:                     # 수동 실행 (첫 실행/검증용)
  # schedule 미사용: 다른 워크플로와 동일하게 Cloud Scheduler(repository_dispatch)로만 트리거
  #   → GitHub Actions cron 의 지연(최대 수 시간) 회피

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 유니버스 ~40종목 × 3년 워크포워드 여유

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-auth \
            gspread \
            requests \
            numpy \
            pandas \
            pytz

      - name: 🔬 신호 백테스트 실행 (워크포워드 → Signal_Backtest 시트)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_signal_backtest.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "월간 신호 백테스트 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
