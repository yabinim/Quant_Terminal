name: 🔬 월간 신호 백테스트 (Signal Backtest)

on:
  repository_dispatch:
    types: [trigger-backtest-monthly]   # Cloud Scheduler → GitHub API로 트리거 (월 1회)
  workflow_dispatch:                     # 수동 실행 (첫 실행/검증용)
    inputs:
      # v2.7: 확정 일수 스윕. "2일 확정이 값어치를 하는가" 를 재기 위한 입력.
      #   1 = 조건이 처음 참이 된 다음날 매수 (장중 헤드업이 잡아주는 시점)
      #   2 = 현행 (기본값)
      #   3 = 더 기다림 — 방향 일관성 확인용
      #
      # ⚠️ 세 번을 **같은 날** 돌려야 비교가 성립한다. 다른 날 돌리면
      #    History_End 가 달라져 평가 창이 어긋난다.
      confirm_days:
        description: '확정 일수 (1~10, 기본 2). 비우면 2'
        type: string
        default: '2'
      # v2.8: 페치 성공률 하한. 이 아래면 시트에 **기록하지 않고 중단**한다.
      #   부분 유니버스 결과는 크기만 다를 뿐 정상 행처럼 보여서 사후에 못 골라낸다.
      #   ⚠️ 낮추지 말 것. 낮춰야 할 상황이면 원인(429/타임아웃)을 먼저 고치는 게 맞다.
      #      낮추면 로그에 [WARN] 이 찍히고, 그 run 의 결과는 신뢰할 수 없다.
      min_fetch_rate:
        description: '페치 성공률 하한 (0.0~1.0, 기본 0.98). 비우면 0.98 — 보통 건드리지 않는다'
        type: string
        default: ''
  # schedule 미사용: 다른 워크플로와 동일하게 Cloud Scheduler(repository_dispatch)로만 트리거
  #   → GitHub Actions cron 의 지연(최대 수 시간) 회피

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    # 유니버스 474종목(시트 합집합) → 봉 수 조건 통과 ~241종목 × 왕복 5모드.
    #   ⚠️ v2.8 정정: 예전 주석의 '~160종목' 은 **레이트리밋으로 잘린 숫자**였다.
    #      스로틀이 없어 474 중 299만 받아왔고, 거기에 봉 수 조건을 걸어 151~159가
    #      됐다. 이제 474 전부를 받아오므로 평가 종목이 늘고 시간도 늘어난다.
    #   페치가 스로틀(200/분)에 걸려 ~2.5분 추가된다. 실측 45분 + 여유 = 120분 유지.
    #   조기 종료되면 로그 끝에 [DONE] 초 단위가 안 찍히므로 그걸로 판별.
    timeout-minutes: 120

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-auth \
            gspread \
            requests \
            numpy \
            pandas \
            pytz

      - name: 🔬 신호 백테스트 실행 (워크포워드 → Signal_Backtest / Signal_Backtest_RT 시트)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
          # repository_dispatch(정기 실행)에는 inputs 가 없다 → 빈 값 → 파이썬이 2로 폴백.
          # 표현식으로 값을 만들지 않고 **입력값을 그대로 넘긴다** — 선택지가 늘 때마다
          # 고쳐야 하는 매핑은 언젠가 안 고쳐진다(2026-08-22 실제 사고).
          CONFIRM_DAYS: ${{ inputs.confirm_days }}
          MIN_FETCH_RATE: ${{ inputs.min_fetch_rate }}
          # v2.8: FMP 분당 한도. Starter 는 300/분이고 여기 200 은 그 67%.
          #   ⚠️ 300 으로 올리지 말 것 — 한도에 붙이면 다시 429 가 난다. 2026-08-26
          #      진단에서 스로틀 없이 474종목을 쏴서 정확히 299개만 통과했다
          #      (299 = 300 − SPY 1콜). 나머지 174종목은 몇 주간 무성 탈락했다.
          FMP_RATE_LIMIT_PER_MIN: '200'
        run: |
          python automation/run_signal_backtest.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "월간 신호 백테스트 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
