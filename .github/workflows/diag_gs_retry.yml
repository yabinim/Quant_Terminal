name: 🔁 진단 — Sheets 재시도 SSOT 통합 가드 (수동 전용)

# 언제 쓰나:
#   1) gs_retry.py 를 건드린 뒤 — 소비자가 9개다. 여기 손대면 반드시 돌린다
#   2) run_signal_backtest.py · diag_satellite_backtest.py 를 배포하기 직전
#   3) 새 자동화에 Sheets 재시도를 붙일 때 (복제하지 말고 gs_retry 를 쓰라는 관문)
#
# 왜 필요한가 — 2026-09-04 통합 이전, 재시도 로직이 **세 벌** 있었다:
#
#     gs_retry.call                   5시도 · 1.5→3→6→12초   · 예산 ~22초
#     run_signal_backtest._gs         6시도 · 2→4→8→16→32초  · 예산 ~62초
#     diag_satellite_backtest._gs     위와 거의 같은 복사본
#
#   뒤 둘을 지우고 gs_retry 로 **기계적으로 치환하면 예산이 62 → 22초로
#   조용히 줄어든다.** 그 62초는 우연이 아니다 — 두 백테스트는 몇 시간치 FMP
#   수집이 끝난 맨 마지막에 시트에 쓰고, 그 한 번의 실패가 런 전체를 무효로
#   만든다. 반대로 gs_retry 의 22초는 5PM 알림 경로용이고 거기서는 늦는 것
#   자체가 실패다. **예산 차이는 지켜야 할 설계 결정이지 정리 대상이 아니다.**
#
#   그래서 구현만 합치고 정책은 PROFILE_BATCH 로 남겼다. 이 워크플로는
#   그 정책이 조용히 뭉개지지 않았는지를 초 단위로 확인한다.
#
# 무엇을 검사하나 (53항목):
#   G1  기본 경로(_profile=None)가 통합 이전과 **완전히 같은** 대기열을 낸다
#       → 기존 소비자 7개(run_earnings_watch · refresh_market_calendar ·
#         refresh_industry_perf · backfill_insider_stats ·
#         diag_earnings_batchwrite 등)의 동작 무변경 보증
#   G2  PROFILE_BATCH 가 옛 _gs 값 그대로 (2/4/8/16/32 · 지터 25% · 6시도)
#   G3  두 예산이 설계대로 갈라져 있다 (24초 ≠ 62초)
#   G4  _retries 명시가 프로파일보다 우선
#   G5  WorksheetNotFound / SpreadsheetNotFound 즉시 raise (정상 흐름)
#   G6  4xx 재시도 안 함 · G7 429/5xx 재시도함
#   G8  HTTP 상태를 못 읽는 예외를 **재시도한다**
#       ← 통합하며 의도적으로 바꾼 유일한 항목. 이전 백테스트는 이걸
#         재시도하지 않고 죽었다(google.auth TransportError · ssl.SSLError ·
#         RemoteDisconnected). 정책 선택이 아니라 버그 수정이다.
#   G9  성공 경로 통계 · G10 중복 재발 래칫 · G11 위임 확인
#   M   위 검사가 결함을 실제로 잡는지 뮤테이션 역검증 (7건)
#
#   ⚠️ G1/G2 는 gs_retry 의 상수를 읽어와 자기 자신과 비교하지 **않는다.**
#      기대값을 diag 파일에 직접 박아뒀다. 자기참조 테스트는 상수 변경을
#      통과시킨다 — 누가 1.5 를 3.0 으로 바꿔도 초록불이 된다.
#
#   ⚠️ G10 은 문자열 검색이 아니라 AST 로 최상위 정의만 본다. 주석·독스트링에
#      `_gs_is_transient` 가 등장하는 것은 설명이지 구현이 아니다
#      (실제로 세 파일의 주석에 남아 있다).
#
# 락스텝: gs_retry.py(루트) + run_signal_backtest.py + diag_satellite_backtest.py
#   세 파일을 같은 커밋에 올린다.
#   · gs_retry.py 가 낡으면 → 락스텝 관문이 "gs_retry.PROFILE_BATCH 가 없다" 로
#     즉시 exit 1 (트레이스백 아님)
#   · 백테스트 2개가 낡으면 → G10/G11 이 10건 실패
#   부분 배포는 설계상 빨간불이다.
#
# 안전성:
#   · 네트워크 접근 없음 · 시트 접근 없음 · FMP 호출 없음 · 이메일 없음
#   · 실제 sleep 없음 (전부 몽키패치로 가로챈다) → 몇 초 만에 끝난다
#   · 부작용 전혀 없다. 몇 번을 돌려도 같은 결과.

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # gspread 가 있어야 G5(WorksheetNotFound/SpreadsheetNotFound)가 진짜
      # 예외 클래스로 검사된다. 없으면 gs_retry 내부 스텁으로 대체되어
      # 검사는 통과하지만 실제 자동화 환경과 다른 것을 본다.
      #
      # ⚠️ numpy·pandas·pytz 는 diag_gs_retry 가 아니라 **락스텝 짝**인
      #    diag_fmp_ssot 때문에 필요하다. 그쪽이 B군에서
      #    diag_satellite_backtest 를 실제로 import 하고, 그 모듈이 셋을 쓴다.
      #    2026-09-04 첫 실행에서 여기에 gspread 만 넣었다가
      #    `ModuleNotFoundError: No module named 'pandas'` 로 B군이 통째로
      #    죽었다 — A1/A2/A4 는 이미 통과한 뒤였는데 exit 1 이라 뒤 스텝이
      #    끊길 뻔했다(신선도 지문 스텝의 `if: always()` 가 그걸 막았다).
      #    diag_fmp_ssot.yml 의 의존성 줄과 **같은 목록을 유지한다.**
      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install numpy pandas pytz requests gspread google-auth

      - name: 🔁 Sheets 재시도 SSOT 통합 가드
        run: python automation/diag_gs_retry.py

      # 락스텝 짝. gs_retry 변경이 A1 래칫이나 B군 복제 대조를 건드리지
      # 않았는지 같이 본다 (B25/B26 이 두 백테스트 파일을 서로 대조한다).
      - name: 🛡️ FMP SSOT · 튜플 계약 가드 (락스텝)
        run: python automation/diag_fmp_ssot.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          gs_retry.py
          narrative_core.py
          automation/diag_gs_retry.py
          automation/run_signal_backtest.py
          automation/diag_satellite_backtest.py

      # 지문 표를 로그에 남긴다. 락스텝 업로드가 빠졌으면 마커가 비어
      # 여기서 눈에 보인다 (2026-09-03 에 A1 빨간불로 이 스텝이 통째로
      # 스킵된 적이 있어 순서를 뒤에 두지 않았다).
      - name: 🧾 파일 신선도 지문
        if: always()
        run: python check_freshness.py .
