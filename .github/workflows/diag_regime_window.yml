name: 🔍 진단 — regime 52주 창 회귀 가드 (수동 전용)

on:
  workflow_dispatch:        # 수동 실행만. 스케줄러/디스패치 트리거 없음.

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # 네트워크·시트 접근 없음 — 보통 10초 이내

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # regime_core 는 pandas/numpy 만 의존한다(파일 상단 설계 불변식).
      # 이 가드도 그 이상을 요구하지 않는다 — FMP 키도 시트 키도 필요 없다.
      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install numpy pandas

      - name: 🔍 52주 창 회귀 가드 (FMP 콜 0 · 시트 접근 없음)
        run: |
          python automation/diag_regime_window.py
