name: 🔬 진단 — 로테이션 게이트 검증 (수동 전용)

# 언제 쓰나:
#   fmp_extras 의 레버리지 판별(get_leverage_multiplier / is_rotation_excluded /
#   is_leverage_suspect)이나 rotation_core 의 게이트를 건드린 직후, 배포 전.
#
# 무엇을 검사하나 (80항목):
#   A 레버리지 판별 — 일반형 배수 캡처(2X~5X·소수배수), 단어형(Ultra 계열),
#                     의심 키워드, SHORT 오탐 방지, 배수 뒤 단어경계
#   B 유동성       — 달러거래대금 계산·임계·날짜 교집합·창 경계
#   C 순자산       — '모르면 제외'. 옛 `if aum and aum < MIN` falsy 통과 회귀 방지
#   D 크립토 판정  — 이름·섹터·SOLAR 오탐 방지·'모르면 통과'
#   E 상관 중복제거 — 래퍼 3형제 축약, 순서 의존, 관측일 부족 시 통과
#   F 크립토 캡    — 2슬롯 한도, 슬롯 승계
#   G 통합         — 2026-08-29 실제 사고(SPAX·HYPE 3형제·KMCA) 재현
#   H 양성 대조    — 알려진 불량 입력에서 진단이 실제로 실패하는지
#
#   ⚠️ 로직을 복사하지 않는다. fmp_extras / rotation_core 의 실제 함수를
#      호출한다. 패치 전 모듈에 물리면 AttributeError 로 죽는다.
#
#   ⚠️ A-19/A-20~23, C-7~9 는 돌연변이 시험에서 생존한 구멍을 막으려고 추가된
#      판별 케이스다. 지우면 다음 셋이 조용히 통과한다:
#        · 배수 뒤 단어경계 제거(2XU 오탐)
#        · 2배 단어형(Ultra) 제거 — 인버스·3배 경로가 구멍을 가린다
#        · AUM 0 가드 제거 — 최종 비교가 결과를 가린다
#
# 안전성:
#   · 네트워크·시트·FMP·메일 접근 전부 없음 · 시크릿 불필요 · 부작용 없음

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install numpy pandas pytz requests gspread google-auth
          # pytz·requests 는 fmp_extras 가 요구한다 (fmp_http 경유).
          # streamlit 은 fmp_extras 안에서 try/except 로 감싼 선택 의존이라 불필요.
          # 이 줄은 diag_fmp_ssot.yml / diag_confirm_sweep.yml 과 동일하게 유지한다 —
          # fmp_extras 를 import 하는 진단은 전부 같은 의존 집합을 갖는다.

      - name: 🔬 로테이션 게이트 회귀 + 양성대조
        run: python automation/diag_rotation_policy.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          fmp_extras.py
          rotation_core.py
          app.py
          automation/run_hidden_alpha.py
          automation/diag_rotation_policy.py
