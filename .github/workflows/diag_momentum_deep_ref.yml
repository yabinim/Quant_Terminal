name: 📐 진단 — 깊은 창 참고 실행 (판정 아님 · 수동 전용)

# 무엇을 재는가
# ─────────────
#   "각 룰(blend · mom12_0 · mom12_1)이 하락·반등 구간에서 어떻게 깨지나" — 하나뿐이다.
#   "어느 룰이 이기나"는 답하지 않는다. 승수·전체 기간 샤프 순위는 출력하지 않는다.
#   사전 약정(−12% · 126봉 · 대상 룰·필터 · 결과로 하지 않는 것)은
#   automation/diag_momentum_deep_ref.py 상단과 SATELLITE_MANDATE §4① 에 있다.
#
# ⚠️ 판정이 아니다. §4① 판정 재실행(2027-03-08)은 📐 랭킹 룰 × 집중도 비교 워크플로가
#    1,826달력일 핀으로 돈다. 이 워크플로는 bt.WINDOW_DAYS_OVERRIDE 를 **자기 프로세스
#    안에서만** 켠다 — 판정 파일은 그 값을 쓸 수 없다(diag_fmp_ssot B4s).
#
# ⚠️ 결과는 Momentum_Rule_Deep 탭에만 기록한다. Momentum_Rule_Compare 에는 쓰지 않는다.
#
# 콜 예산: 후보 풀 56 + SPY = 57종목 × 2엔드포인트 = 114콜. 페이로드는 판정 실행의
#   약 4배(≈5,000봉). 📐 랭킹 룰 비교 · 🛰️ 위성 백테스트와 같은 분에 겹쳐 돌리지 말 것.
#
# 중단 조건(시트에 쓰지 않음): SPY 없음 · 페치율 < min_fetch_rate · SPY 배당조정 실패 ·
#   배당조정 계열이 원종가보다 7일 넘게 늦게 시작하는 종목이 하나라도 있음.

on:
  workflow_dispatch:        # 수동 실행만. 스케줄러/디스패치 트리거 없음.
    inputs:
      as_of:
        description: >-
          기준일 고정 (YYYY-MM-DD). 비우면 오늘 기준. ⚠️ FMP 창 바닥은 롤링이라
          기준일이 늦을수록 2008 하락의 앞부분이 더 잘린다.
        required: false
        default: ''
      min_fetch_rate:
        description: '페치 성공률 하한 (기본 0.98). 이 밑이면 시트에 안 쓰고 중단.'
        required: false
        default: '0.98'

jobs:
  deep_ref:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install google-auth gspread requests numpy pandas pytz

      # 락스텝 짝. override 경로(B4p~B4s)와 판정 경로 불변(B4q)이 여기서 먼저 확인된다.
      - name: 🛡️ FMP SSOT · 튜플 계약 가드 (락스텝)
        run: python automation/diag_fmp_ssot.py

      - name: ✅ 위성 백테스트 엔진 자체검증 (합성 데이터 · 네트워크 불필요)
        run: python automation/diag_satellite_backtest.py --selftest

      - name: ✅ 룰 비교 축·판정 자체검증 (합성 데이터 · 네트워크 불필요)
        run: python automation/diag_momentum_rule_compare.py --selftest

      - name: ✅ 깊은 창 참고 실행 자체검증 (합성 데이터 · 네트워크 불필요)
        run: python automation/diag_momentum_deep_ref.py --selftest

      - name: 📐 깊은 창 참고 실행 (읽기 전용 · Momentum_Rule_Deep 시트에만 기록)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          AS_OF:       ${{ inputs.as_of }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
          # FMP Starter 한도는 분당 300. 67% 로 둔다. ⚠️ 300 으로 올리지 말 것.
          FMP_RATE_LIMIT_PER_MIN: '200'
          MIN_FETCH_RATE: ${{ inputs.min_fetch_rate }}
        run: |
          python automation/diag_momentum_deep_ref.py
