name: 🔬 진단 — C트랙 PEAD·순주식발행 데이터 프로브 (수동 전용)

# 언제 쓰나:
#   C 트랙 다음 두 후보(PEAD 라이브 라벨 검증 · 순주식발행 필터)가 **데이터 때문에**
#   성립하는지를 사전 약정 전에 확인한다. 가설 검증이 아니다.
#
#   A) earnings?symbol= 과거 깊이 · limit 반응 · includeReportTimes 과거 행 채움
#      + 유니버스(Tier 1 전 종목 + Tier 2 표본) 판정/표시 구간 사건 수
#   B) historical-market-capitalization ÷ 종가 = 역산 주식 수의 시점성 · 분할 연속성
#      + income-statement 주식 수 깊이 · 분할 조정 + splits 제공 여부
#
# 판독 기준은 스크립트 docstring 에 **실행 전** 기록돼 있다(요약 블록의 7줄).
#
# 안전성:
#   · 수익률 계산 0 · 라벨 산출 0 — 사전 약정 전 오염 방지
#   · 시트 **쓰기 0** · 읽기는 Watchlist/Portfolios/Earnings_Universe 티커 목록뿐
#   · 이메일 없음 · 알림 상태 머신 미접촉
#   · 고정 31콜 + 유니버스(Tier 1 + Tier 2 표본). fmp_http 경유 — 레이트리밋 적용
#
# ⚠️ repository_dispatch / schedule 없음 — 일회성 프로브가 매일 콜을 태우면 안 된다.

on:
  workflow_dispatch:
    inputs:
      t2_sample:
        description: "Tier 2(대형주 유니버스) 표본 크기 — 0 이면 Tier 2 생략"
        required: false
        default: "60"
      tickers:
        description: "(선택) Tier 1 을 시트 대신 이 목록으로 — 쉼표 구분. 비우면 시트 사용"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas pytz gspread google-auth

      # ── 임포트 스모크 (콜 0) ──────────────────────────────────────────
      # 문법 검사(py_compile · check_py311)는 모듈 최상단 실행 오류를 못 잡는다
      # (2026-08-22 diag_fmp_newcaps NameError 교훈). 여기서 실제로 임포트한다.
      # FMP_API_KEY 를 주지 않으므로 main 은 돌지 않고 네트워크도 만지지 않는다.
      - name: 🧪 임포트 스모크 (콜 0)
        run: |
          python -c "import sys; sys.path.insert(0,'automation'); import diag_pead_issuance_probe; print('import OK')"

      - name: 🔬 C트랙 데이터 프로브 (읽기 전용)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
          T2_SAMPLE: ${{ inputs.t2_sample }}
          TICKERS: ${{ inputs.tickers }}
        run: python automation/diag_pead_issuance_probe.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/diag_pead_issuance_probe.py
