name: 🔬 진단 — 앱 시장상태 라벨 휴장일 인식 검증 (수동 전용)

# 언제 쓰나:
#   app.py 의 get_market_status() 나 calendar_core 를 건드린 직후, 배포 전.
#
# 왜 필요한가:
#   이 결함은 **조용히** 틀렸다. 추수감사절 오전 10시에 헤더가
#   "🟢 Regular Market (Open)" 을 띄워도 에러 로그가 남지 않는다.
#   A-1 에서 자동화 5개 파일은 calendar_core 로 옮겼는데 app.py 만 빠져 있었고,
#   그 사실을 알려주는 신호가 아무 데도 없었다.
#
# 무엇을 검사하나 (30항목):
#   S 정적 검사  — calendar_core import 배선 / 별칭이 mcal 인지 /
#                  mcal 재대입(섀도잉) 없는지 / 휴장 검사가 시간대 분기보다 앞인지
#   T 동작 검사  — 휴장일 7건(2026·2027) · 휴장일 프리마켓/애프터 ·
#                  평일 시간대 경계 7건 · 주말 · None · 휴장 전후일
#   M 뮤테이션   — 휴장 검사 제거 / not 반전 / 개장 라벨 반환 / 주말 라벨 소실
#
#   ⚠️ 이 스크립트는 로직을 복사하지 않는다. app.py 를 AST 로 파싱해
#      get_market_status 의 **실제 소스**를 꺼내 exec 한다. 복사본을 테스트하면
#      app.py 를 안 고쳐도 통과하는 가짜 초록불이 된다(과거 M1/M2 클래스 실패).
#      실제로 수정 전 app.py 에 물리면 12건이 실패한다 — 검증된 사실.
#
# 안전성:
#   · 네트워크 접근 없음 · 시트 접근 없음 · FMP 호출 없음 · Gemini 호출 없음
#   · 부작용 전혀 없다. 몇 번을 돌려도 같은 결과.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # calendar_core 는 pytz 만 쓴다(그마저도 try/except 로 선택적).
      # app.py 는 import 하지 않고 AST 파싱만 하므로 streamlit 등은 불필요하다.
      - name: 📦 의존성
        run: pip install pytz

      - name: 🔬 시장상태 라벨 회귀 + 뮤테이션 검증
        run: python automation/diag_market_status.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          app.py
          calendar_core.py
          automation/diag_market_status.py
