name: 🔬 진단 — A-2b 미수신 원인 판정 경로 프로브 (수동 전용)

# 언제 쓰나:
#   A-2b(미수신 원인 확정) 구현 **전에** 한 번. 결과로 설계를 확정한다.
#
# 왜 프로브가 먼저인가:
#   구현 도중 402 를 맞은 전례가 여러 번 있다(etf/holdings, analyst-estimates,
#   transcript 계열). HTTP 402(플랜 미포함 — 코드로 해결 불가)와 404(경로 오류 —
#   코드로 해결 가능)는 대응이 완전히 다르다. 먼저 재보고 설계한다.
#
# 무엇을 결정하나:
#   경로 A (종목별) profile.isActivelyTrading → 미수신 티커 수만큼 N 콜
#   경로 B (전역)   symbol-change / delisted-companies 대조 → 1~2 콜 고정
#
#   가장 위험한 함정은 **파라미터 무시**다. FMP 는 모르는 파라미터를 에러 없이
#   무시하고 전체 피드를 200 으로 주기도 한다. 그걸 '필터 지원'으로 오독하면
#   엉뚱한 티커에 엉뚱한 원인이 붙는다 — 원인을 모르는 것보다 나쁘다.
#   그래서 필터 결과를 무필터 결과와 대조해 IGNORED 를 따로 판정한다.
#
# 호출 예산:
#   기본 11 콜. 시드 확보(P1/P2) 가 실패하면 4 콜에서 조기 종료한다.
#   PROBE_HEAVY=1 이면 +1 (actively-trading-list, 2.6만건 — 크기 실측용).
#
# 안전성:
#   · 시트 접근 없음 · 쓰기 없음 · Gemini 호출 없음 · 읽기 전용 GET 뿐
#   · dryrun 단계는 네트워크조차 안 쓴다(키 불필요).

on:
  workflow_dispatch:
    inputs:
      heavy:
        description: 'actively-trading-list 크기도 실측 (+1콜, 2.6만건)'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: pip install requests

      # ── 사전 게이트 ────────────────────────────────────────────────────
      # 프로브가 콜을 태우다 중간에 죽는 게 최악이다. 재실행에 또 콜이 든다.
      # 가짜 응답 5종(정상·필터무시·시드없음·필드결손·이상값)을 물려
      # 모든 분기를 네트워크 없이 미리 밟는다. 여기서 죽으면 콜을 안 쓴다.
      - name: 🧪 오프라인 사전 검증 (콜 0)
        run: python automation/diag_nodata_cause_dryrun.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/diag_nodata_cause.py
          automation/diag_nodata_cause_dryrun.py

      # ── 실제 프로브 ────────────────────────────────────────────────────
      - name: 🔬 A-2b 원인 판정 경로 프로브
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PROBE_HEAVY: ${{ inputs.heavy && '1' || '' }}
        run: python automation/diag_nodata_cause.py
