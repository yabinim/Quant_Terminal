name: 📅 5PM 주말·휴일 (내러티브 + 주간 리포트 + 3버킷 스캐너)

on:
  repository_dispatch:
    types: [trigger-5pm-weekend]   # Cloud Scheduler → GitHub API로 트리거
  workflow_dispatch:
    inputs:
      force_hidden_alpha:
        description: 'Hidden Alpha 강제 발송 (주1회 가드 무시)'
        type: boolean
        default: false
      force_weekly:
        description: '주간 리포트 + 3버킷 스캐너 강제 실행 (토요일 가드 무시)'
        type: boolean
        default: false
  # schedule 제거: GitHub Actions 자체 스케줄 비활성화

jobs:
  run-5pm-weekend:
    runs-on: ubuntu-latest
    # 주간 리포트(Gemini 1회) + 3버킷 스캔(FMP 병렬 수집 + Gemini 청크 3~6회)이
    # 추가되어 기존 20분으로는 부족하다.
    timeout-minutes: 45

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            fredapi

      - name: 📰 시장 내러티브 생성 (주말)
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_narrative.py

      # ── 주간 리포트 (토요일 전용) ────────────────────────────────────────
      # 스크립트 내부에 토요일 가드 + ISO주 중복 가드가 있어 일요일엔 스스로 스킵한다.
      # 실패하면 exit 1 → 다음 스캐너 스텝이 자동으로 건너뛰어진다(설계 확정 ③).
      - name: 📊 주간 트렌드 리포트 (토요일)
        id: weekly
        if: always()
        env:
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:            ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:         ${{ secrets.GSPREAD_KEY }}
          WEEKLY_REPORT_FORCE: ${{ inputs.force_weekly && '1' || '' }}
        run: |
          python automation/run_weekly_report.py

      # ── 3버킷 AI 종목 스캐너 (주간 리포트 성공 시에만) ──────────────────
      # steps.weekly.outcome == 'success' 가 설계 확정 ③(실패 시 스캔 스킵)을 구현한다.
      - name: 🚀 주간 3버킷 스캐너 + 워치리스트 편입
        if: steps.weekly.outcome == 'success'
        env:
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          FMP_API_KEY:         ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:            ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:         ${{ secrets.GSPREAD_KEY }}
          SCANNER_SCAN_FORCE:  ${{ inputs.force_weekly && '1' || '' }}
          # FMP Starter 플랜 = 300콜/분. 여유를 두고 250 으로 페이싱한다.
          # (미설정 시 스캐너가 61초에 950콜을 쏴 한도를 3배 초과 → 확산주 76종목 중
          #  73종목이 데이터 수집에 실패하고 뒤이은 Hidden Alpha 까지 죽었다)
          FMP_RATE_LIMIT_PER_MIN: '200'
          FMP_MAX_RETRIES: '3'
          # 확산주 유니버스 최소 등장 일수 (7일 중). 풀이 여전히 크면 3으로 올린다.
          WEEKLY_EXPANSION_MIN_DAYS: '2'
          # 사용자당 워치리스트 총량 상한. run_watchlist_alerts 가 매 평일 전 종목을
          # 평가하므로 인원수 × 종목수만큼 FMP 부하가 는다.
          WATCHLIST_MAX_PER_USER: '100'
        run: |
          python automation/run_scanner_scan.py

      # 레이트 리미터는 프로세스별 슬라이딩 윈도우라 프로세스가 바뀌면 초기화된다.
      # 직전 1분에 소모한 토큰이 FMP 서버 쪽에는 남아 있으므로 쿨다운을 둔다.
      - name: ⏳ FMP 레이트리밋 쿨다운
        if: always()
        run: sleep 60

      - name: 💰 Hidden Alpha Radar (주간 · Top5 로테이션)
        if: always()
        env:
          FMP_API_KEY:        ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:        ${{ secrets.GSPREAD_KEY }}
          HIDDEN_ALPHA_FORCE: ${{ inputs.force_hidden_alpha }}
          FMP_RATE_LIMIT_PER_MIN: '200'
          FMP_MAX_RETRIES: '3'
        run: |
          python automation/run_hidden_alpha.py

      # ── 시장 캘린더 갱신 (주 1회) ────────────────────────────────────────
      # 휴장일 판정 자체는 calendar_core 규칙 계산이라 FMP·시트 없이 동작한다.
      # 이 스텝은 규칙으로 잡을 수 없는 **임시 휴장**(대통령 국장일 등)을 찾기
      # 위한 것이다. FMP 캘린더를 받아 Market_Calendar 시트에 저장하고 규칙
      # 계산과 대조한다. 불일치가 나오면 Reminders 에 점검 항목이 생긴다.
      #
      # if: always() — 앞 스텝이 실패해도 캘린더 갱신은 독립적으로 돌아야 한다.
      # 실패해도 판정 경로에 영향이 없으므로 워크플로를 실패시키지 않는다.
      - name: 🗓️ 시장 캘린더 갱신 + 규칙 대조
        if: always()
        continue-on-error: true
        env:
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY:  ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/refresh_market_calendar.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "5PM 주말 자동화 완료"
          echo "주간 리포트: ${{ steps.weekly.outcome }}"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
