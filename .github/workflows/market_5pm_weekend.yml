name: 📅 5PM 주말·휴일 (내러티브만)

on:
  repository_dispatch:
    types: [trigger-5pm-weekend]   # Cloud Scheduler → GitHub API로 트리거
  workflow_dispatch:
    inputs:
      force_hidden_alpha:
        description: 'Hidden Alpha 강제 발송 (주1회 가드 무시)'
        type: boolean
        default: false
  # schedule 제거: GitHub Actions 자체 스케줄 비활성화

jobs:
  run-5pm-weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            fredapi

      - name: 📰 시장 내러티브 생성 (주말)
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_narrative.py

      - name: 💰 Hidden Alpha Radar (주간 · Top5 로테이션)
        if: always()
        env:
          FMP_API_KEY:        ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:        ${{ secrets.GSPREAD_KEY }}
          HIDDEN_ALPHA_FORCE: ${{ inputs.force_hidden_alpha }}
        run: |
          python automation/run_hidden_alpha.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "5PM 주말 자동화 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
