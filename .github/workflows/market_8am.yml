name: 📰 8AM Pre-Market (내러티브 + DRG 예측)

on:
  schedule:
    # 평일 8AM ET = UTC 12:00 (서머타임: UTC 11:00)
    # 서머타임(3월~11월): 0 11 * * 1-5
    # 표준시(11월~3월):   0 12 * * 1-5
    # → 보수적으로 12:00 UTC 사용 (서머타임 기간엔 8AM ET보다 1시간 늦지만 허용 범위)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:   # 수동 실행 허용 (테스트용)

jobs:
  run-8am:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            yfinance \
            fredapi

      - name: 🔑 GCP 서비스 계정 키 준비
        env:
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
        run: |
          echo "GSPREAD_KEY 확인 완료"

      - name: 📰 시장 내러티브 생성
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_narrative.py

      - name: ⏳ 내러티브-DRG 간 30초 대기 (API 부하 분산)
        run: sleep 30

      - name: 🚨 DRG 시장 예측 생성
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_drg_predict.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "8AM 자동화 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
