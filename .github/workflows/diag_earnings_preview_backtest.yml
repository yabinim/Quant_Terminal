name: 🔬 실적 프리뷰 요인 백테스트 (진단)

# 진단 스크립트는 수동 실행만 — 스케줄 트리거를 두지 않는다.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "쉼표 구분 티커 (비우면 Watchlist+Portfolios 전체)"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 요인 백테스트 실행
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          python automation/diag_earnings_preview_backtest.py
