name: 🔁 백필 — 내부자 분기 통계 소급 결합 (수동 전용)

# 무엇을 하나:
#   과거 실적 이벤트에 insider-trading/statistics 의 분기 집계를 붙여
#   Insider_Backfill 시트에 적재한다. Pre_Ret_D1/D3/D7 이 같은 행에 오므로
#   "내부자 매도가 실적 반응과 관계있나"를 시트에서 바로 볼 수 있다.
#
# 왜 필요한가:
#   라이브 스냅샷은 insider-trading/search 를 쓴다(최근 90일 달러, 정확함).
#   대신 100행 ≈ 1년치라 소급이 안 된다. statistics 는 종목당 24년치 분기를
#   1콜에 주므로 소급 전용으로 쓴다. 이게 없으면 판정까지 라이브 3개월을
#   기다려야 한다.
#
# 안전성:
#   · Earnings_Events 는 **읽기만** 한다. 21열 스키마를 건드리지 않는다
#   · 쓰기는 새 시트 Insider_Backfill 한 곳뿐 (매 실행 전체 교체)
#   · 이메일 없음 · 알림 상태 머신 미접촉
#   · DRY_RUN=1 이면 시트에 쓰지 않고 앞 5행만 출력한다 — 먼저 이걸로 확인할 것
#
# 비용: 종목당 1콜. MAX_TICKERS 로 상한(기본 150).
#
# ⚠️ repository_dispatch 없음 — 소급 백필은 필요할 때만 돈다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시트에 쓰지 않고 미리보기만"
        type: boolean
        default: true
      max_tickers:
        description: "처리할 종목 수 상한 (비우면 150)"
        type: string
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: pip install requests pandas numpy gspread google-auth

      - name: 🔁 내부자 분기 통계 백필
        env:
          FMP_API_KEY:              ${{ secrets.FMP_API_KEY }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          DRY_RUN:                  ${{ inputs.dry_run && '1' || '' }}
          MAX_TICKERS:              ${{ inputs.max_tickers }}
        run: python automation/backfill_insider_stats.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/backfill_insider_stats.py
