name: 🔬 진단 — Portfolio_Alert_State 키/값 정렬 검증 (수동 전용)

# 언제 쓰나:
#   run_watchlist_alerts.py 의 eval_portfolio_eod 나 _PFSTATE_COLS 를 건드린 직후,
#   배포 전. G열(Swing_Weight_Pct) 추가 시에도 반드시 다시 돌린다.
#
# 왜 필요한가:
#   이 결함은 **조용히** 틀렸다. 손절가가 다른 종목 것으로 바뀌어도
#   에러 로그가 없다. Portfolios 행 순서가 바뀔 때만(전량 매도로 행 삭제,
#   순서 정렬, 중간 삽입) 드러나므로 평소에는 잠복한다.
#
#   패치 전에는 A:D 만 되썼고 E/F(Stop_Loss·Target_Price)는 물리적 행에
#   붙박여 있었다. app.py:load_portfolio_alert_states 가 r[0](키)과
#   r[4]/r[5] 를 같은 행에서 읽으므로 오염이 그대로 앱에 전파됐다.
#
# 무엇을 검사하나 (7항목):
#   A 정렬 불변식 — 순서 유지 / 앞 행 삭제 / 순서 역전 / 중간 삽입 /
#                   nodata 경로 / E·F 부분 미설정
#   B 양성 대조   — 낡은 A:D 쓰기에서 오염이 실제로 발생함을 확인
#                   (하네스가 진짜 결함을 잡는지 검증)
#
#   불변식: 쓰기 후 모든 행의 (Key, Stop_Loss, Target_Price) 짝이
#           쓰기 전과 같아야 한다 — Portfolios 행 순서가 어떻게 바뀌든.
#
#   ⚠️ 이 스크립트는 로직을 복사하지 않는다. run_watchlist_alerts 를 import 해
#      eval_portfolio_eod 의 **실제 함수**를 가짜 gspread 위에서 실행한다.
#      로직을 복사하면 원본을 안 고쳐도 통과하는 가짜 초록불이 된다.
#      실제로 패치 전 코드에 물리면 7건 중 5건이 실패한다 — 검증된 사실.
#
# 안전성:
#   · 네트워크 접근 없음 · 시트 접근 없음 · FMP 호출 없음 · 메일 발송 없음
#   · gspread/FMP 는 전부 가짜 객체로 대체된다. 시크릿이 필요 없다
#     (스크립트가 더미 환경변수를 setdefault 로 채운다).
#   · 부작용 전혀 없다. 몇 번을 돌려도 같은 결과.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # run_watchlist_alerts 를 import 하므로 모듈 레벨 의존성이 전부 필요하다.
      # 다만 실제 호출은 하지 않는다(가짜 객체로 대체).
      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            fredapi

      - name: 🔬 Portfolio_Alert_State 정렬 회귀 + 양성대조
        run: python automation/diag_pfstate_align.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/run_watchlist_alerts.py
          automation/diag_pfstate_align.py
