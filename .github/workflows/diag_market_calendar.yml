name: 🔬 진단 — 시장 캘린더 회귀 검증 (수동 전용)

# 언제 쓰나:
#   calendar_core.py 를 수정한 직후, 배포 전에 돌린다.
#   app.py · run_narrative.py 의 세션 라벨이나 refresh_market_calendar.py 의
#   리마인더 배선을 건드렸을 때도 돌린다 (K절이 그 세 파일을 읽는다).
#
# 왜 필요한가:
#   휴장일 판정이 틀리면 **조용히** 틀린다.
#     · 개장일을 휴장으로 오판 → 그날 알림이 통째로 안 나간다
#     · 휴장일을 개장으로 오판 → 알림 상태머신 확정 카운터가 헛돌아 진행된다
#   둘 다 로그에 에러가 남지 않는다. 기계로 확인하는 수밖에 없다.
#
# 무엇을 검사하나 (187항목):
#   A 골든 재현  — 교체 전 5개 파일에 있던 2025·2026 휴장일 20개 완전 일치
#   B 대체 휴일  — 토→금, 일→월, 신정 토요일 예외
#   C 부활절     — 굿프라이데이 기준값 6개 연도 대조
#   D 판정 계약  — 주말/휴장/개장/임시휴장 보강/폴백 방향
#   E 시트 파싱  — 헤더 결손·깨진 행에도 예외 없이 빈 결과
#   F FMP 대조   — 임시 휴장(국장일) 검출 경로
#   H 반일장     — 조기 마감(13:00) 규칙 골든 7년 + 마감시각 계약
#   I 소비자 배선— automation 이 휴장 게이트를 실제로 부르는가 (AST 래칫)
#   J 세션 구간  — session_phase / narrative_session_label 경계 계약.
#                  반일장 13:00 · 마감 정각 · 마감+4h 정각을 분 단위로 고정
#   K 라벨 배선  — app.py · run_narrative.py 가 밴드(240/570/960/1200)를
#                  **다시 적지 않는가**, DRG market_session 이 마감 시각을
#                  캘린더에서 받는가, 반일장 불일치가 Reminders 로 가는가
#   G 뮤테이션   — 규칙 엔진에 버그를 심어 검사가 잡아내는지 확인
#
#   G 가 핵심이다. 실제로 M3(부활절 +1일)이 개발 중 **마스킹되는 것**을 잡아냈고,
#   그 결과 굿프라이데이에 대체 휴일 규칙을 적용하던 코드를 제거했다.
#
#   K 는 J 와 짝이다. J 만 있으면 calendar_core 는 완벽한데 app.py 가 자기 안의
#   낡은 밴드 표를 계속 쓰는 상태를 통과시킨다 — 그게 정확히 이 절이 추가되기
#   **직전**의 상태였다. 반일장 규칙은 v1.1.0 에 이미 있었는데 세션 라벨은
#   그걸 안 봤다.
#
# 안전성:
#   · 네트워크 접근 없음 · 시트 접근 없음 · FMP 호출 없음
#   · 부작용 전혀 없다. 몇 번을 돌려도 같은 결과.
#   · K절은 app.py 등을 **AST 로 읽기만** 한다. import 하지 않으므로
#     streamlit·gspread 같은 의존성이 필요 없다 (pytz 하나로 유지).

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # calendar_core 는 pytz 만 쓴다(그마저도 try/except 로 선택적).
      - name: 📦 의존성
        run: pip install pytz

      - name: 🔬 calendar_core 회귀 검증
        run: python automation/diag_market_calendar.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          calendar_core.py
          automation/diag_market_calendar.py
          automation/refresh_market_calendar.py
          automation/run_watchlist_alerts.py
          automation/run_drg_predict.py
          automation/run_drg_verify.py
          automation/run_earnings_watch.py
          automation/run_narrative.py
