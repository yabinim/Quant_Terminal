name: 🔬 진단 — FMP 미사용 엔드포인트 실측 (신규 기능 후보 · 수동 전용)

# 언제 쓰나:
#   공식 api-docs 242 경로 중 코드가 쓰는 것은 48개다. 남은 194개 중
#   이 터미널의 철학에 직결되는 후보를 **설계 전에** 쓸 수 있는지 확인한다.
#
#   diag_fmp_endpoints.yml 과 목적이 다르다.
#     · endpoints  = 이미 코드에 박힌 경로가 살아 있나 (쌍 비교)
#     · newcaps    = 아직 안 쓰는 경로를 쓸 수 있나 + **필요 필드가 오나**
#
# ── 티어 ──────────────────────────────────────────────────────────────
#
#   tierA (5콜) — 실제 결함 해결
#     holidays-by-exchange    🔴 _NYSE_HOLIDAYS 가 2026-12-25 에서 끝난다.
#                                run_watchlist_alerts:165 / run_drg_predict:58
#                                / run_drg_verify:54 — 3중 하드코딩 중복.
#                                ★ from/to 를 내년으로 넣어 내년 데이터가
#                                  실제로 오는지까지 확인한다.
#     symbol-change           🔴 티커 변경 → hist 빈 배열 → :823 조용히 skip
#     delisted-companies      🔴 상장폐지 종목의 매도 신호가 영구 침묵
#     actively-trading-list      상장 여부 판정 대안 경로
#     etf/asset-exposure      🟡 app.py:6450 스텁의 정답 후보
#
#   tierB (9콜) — 기존 기능 강화
#     sector/industry performance (스냅샷·시계열 4종) · price-target-summary
#     stock-peers · sec-filings-8k · dividends-calendar
#     mergers-acquisitions-latest
#
#   tierB2 (5콜) — tierB 실측 후 드러난 후속 확인
#     ⚠️ tierB 는 9/9 LIVE 였지만 응답을 보고서야 두 개가 실사용 불가로 드러났다.
#        sec-filings-8k / mergers-acquisitions-latest 둘 다 **symbol 파라미터가
#        없다** — 내 종목 공시를 보려고 시장 전체를 페이징할 수는 없다.
#     sec-filings-search/symbol      종목당 1콜 대체 경로
#     sec-filings-search/form-type   기간당 N페이지 대체 경로 (비용 비교용)
#     mergers-acquisitions-search    이름 검색형 (심볼 역매칭 가능한지)
#     available-sectors              B-1 전제 — 정확한 섹터 분류명
#     available-industries           B-1 전제 — 127개 업종의 정확한 이름
#        (historical-*-performance 는 정확한 문자열을 요구한다. 추측으로 맞추면
#         다른 분류에서 조용히 빈 배열이 온다.)
#
#   tierB3 (3콜) — B-1 설계 직전 확인
#     ⚠️ tierB2 에서 available-industries 가 159건인데
#        industry-performance-snapshot 은 같은 날 127건이었다. 32개 차이.
#        그리고 이력을 API 로 받을 수 있는지가 미확인이다.
#     available-industries            159개 **전체 이름 출력**
#     historical-industry-performance 3년 요청 → 이력 깊이 실측
#     historical-sector-performance   3년 요청 → 동일
#
#     이 3콜로 B-1 의 미결이 전부 닫힌다:
#       3년 오면  → 일회성 백필 → 즉시 백테스트 (대기 0)
#       단기만    → 스냅샷 매일 누적이 유일 경로 (몇 달 대기)
#     파라미터 문자열이 틀리면 402 도 404 도 아닌 **빈 배열**이 온다 —
#     가장 찾기 어려운 실패라 이름을 눈으로 확보해야 한다.
#
#   tierB4 (3콜) — tierB3 의 깊이 판정 재측정
#     ⚠️ tierB3 는 `from = today-3년` 을 보내 3년을 받았고, 그게 "플랜 한도
#        3년"으로 기록됐다. **요청한 날짜부터 왔다는 건 한도를 못 쟀다는 뜻**
#        이지 한도가 3년이라는 뜻이 아니다. 판별력 없는 지표를 판별자로 썼다.
#        반례: historical-price-eod 의 진짜 한도는 실측 5년(1255봉)이었다.
#     ① 좁은 창(20일) 요청   불량 입력 검사 — from/to 가 응답을 자르는가.
#                            판별자는 건수가 아니라 응답 날짜 **범위 폭**.
#                            여기가 🔴 면 ②③ 는 물론 tierB3 기록도 무효다.
#     ② 업종 7년 요청        min(date) 가 요청 from 에서 멈추나, 그 뒤에서 멈추나
#     ③ 섹터 7년 요청        동일
#
#     이 3콜이 롤링 워크포워드의 질을 가른다:
#       3년이면 → 검증창 6개가 한 국면(상승장) 연속 6분기에 갇힌다
#       5년이면 → 학습창에 2022 하락장이 들어온다
#
#   tierC — ✅ 2026-08-22 실행 완료. **드롭다운에서 제거됨.**
#     senate/house-latest       ✅ 200 이지만 tierD 가 전제를 무너뜨림 → 종결
#     holder-performance-summary  🔒 402 플랜 미포함 → 영구 제외
#     historical-industry-pe    ✅ 200 · 65건 · 키 date/exchange/industry/pe
#                               from/to 가 실제로 먹는다(90일 요청 → 65건).
#                               ⚠️ 단, 깊이는 못 쟀다 → tierE 로 이월
#
#   tierD (4콜) — 설계 전에 재야 하는 두 가지 (2026-08-22)
#     D-1/D-2 의회 거래 공시 지연 실측
#       tierC 에서 senate/house-latest 가 살아 있고 symbol 도 온다는 건 확인했다.
#       그런데 '조기 발굴 입력'은 **공시가 빨라야** 성립한다. 미 의회 법정 공시
#       기한은 최대 45일이다. 응답에 transactionDate 와 disclosureDate 가 둘 다
#       오므로 실측이 가능하다.
#       ⚠️ 판별자는 중앙값(disclosure − transaction)이다. 건수나 '최신 피드가
#          온다'는 판별력이 없다 — 45일 늦은 것도 최신 피드다.
#       사전 확정: 14일 이하 유효 / 15~30일 조건부 / 30일 초과 **종결**
#     D-3/D-4 grades 파라미터
#       grades?symbol=AAPL 은 200 이지만 1787건이다. limit 또는 from/to 가
#       먹어야 워치리스트 실사용이 가능하다. 무필터 1787건이라는 **측정된
#       기준선**이 있어서 여기서는 건수 비교가 유효하다.
#       from/to 는 건수만 보지 않는다 — 응답 날짜가 요청 구간 안인지도 본다.
#     ── 실측 결과 (2026-08-22 03:32 UTC) ────────────────────────────────
#     D-1 상원  지연 중앙값 572일 · p90 875일 · 7일 이내 0%  🔴 종결
#     D-2 하원  지연 중앙값  27일 · p90 704일 · 7일 이내 3%  🟡 조건부
#         → app.py:21546 · VERDICT_2026-08-22_congress_trades_terminated.md
#     D-3 limit=10   → 1787건. 🔴 무시됨
#     D-4 from/to 1년 → 1787건 · 응답 날짜 2012-02-08~2026-08-10 · 구간 밖 1674건
#         🔴 무시됨. **워치리스트 전체 적용 불가**로 확정
#
#   grades — 🔴 **콜 없이 종결.** 드롭다운에서 제거됨.
#     grades 키           action/date/gradingCompany/newGrade/previousGrade/symbol
#     grades-consensus 키 strongBuy/buy/hold/sell/strongSell/consensus/symbol
#     ratings-snapshot    이미 제거 완료(호출 0건 · diag_analyst_congress A-1 래칫)
#     → 겹치는 필드는 symbol 뿐. **중복이 아니다** — 이벤트 로그 vs 스냅샷 집계.
#
#   tierE (1콜) — tierC 의 유일한 잔여분 (2026-09-03)
#     historical-industry-pe 를 **7년** 요청해 이력 깊이를 잰다.
#     tierC 는 90일을 요청해 90일을 받았다. 그건 깊이를 못 잰 것이다 —
#     tierB3 와 정확히 같은 요청값 종속 함정이다.
#     판별자: min(date) − 요청 from   (≈0 한도 미도달 / ≫0 한도 발견)
#     사전 확정: 확보 폭 5년 이상 → 기록 후 보류 / 5년 미만 → 종결
#     ⚠️ ✅ 라도 자동 착공이 아니다. 기능화하려면 백필 149콜 + 새 와이드 시트 +
#        일일 유지콜(`industry-pe-snapshot` 존재 여부 미확인)이 필요하고,
#        형제 신호인 업종 모멘텀은 2026-09-01 워크포워드에서 1/6 로 부결됐다.
#
#   all (30콜)
#     ⚠️ 이 숫자를 손으로 세지 마라. 실행 헤더의 `호출 N콜` 이 len() 기반
#        진짜 값이다. 과거에 py 32 · yml 주석 32 · yml 설명 36 으로 갈렸다.
#
# ── 판정 읽는 법 ──────────────────────────────────────────────────────
#   ✅ LIVE    200 + 데이터 + 필요 필드 전부 존재    → 설계 진행 가능
#   🟠 FIELDS  200 이지만 필요 필드 누락/범위 밖     → 설계 전제 재검토
#   ⚠️ EMPTY   200 + 빈 배열                         → 날짜 바꿔 재실행
#   🔒 PLAN    402                                   → 후보에서 제외
#   ❌ 404 등  경로 실패
#
#   402 와 404 를 뭉개면 엉뚱한 수정을 하게 된다 — 지난 감사의 교훈.
#
# 안전성:
#   · 시트 접근 없음 — 읽지도 쓰지도 않는다
#   · 이메일 없음 · 알림 상태 머신 미접촉
#   · 프로젝트 모듈 import 없음 (requests 만 사용)
#   → 사본 신선도와 무관하다. 몇 번을 돌려도 부작용이 없다.
#
# ⚠️ repository_dispatch / schedule 없음 — 일회성 프로브가 매일 콜을 태우면 안 된다.

on:
  workflow_dispatch:
    inputs:
      # ⚠️ 기본값이 tierE 다(1콜). 예전 기본값은 tierA(5콜)였는데, tierA~tierD 는
      #    전부 판정이 끝난 그룹이라 실수로 눌리면 닫힌 질문에 콜이 나간다.
      #    지금 열려 있는 질문은 tierE 하나뿐이므로 그게 기본값이어야 한다.
      # ⚠️ tierC / grades 는 제거됐다. 낡은 북마크로 그 값이 들어오면 스크립트가
      #    조용히 tierA(5콜)로 떨어진다 — 실행 헤더의 `티어:` 줄을 꼭 확인할 것.
      tier:
        description: "확인 티어 (tierE=업종PER깊이 1콜 ★유일한 미결 / tierA=결함해결 5콜 ✅종결 / tierB=기능강화 9콜 ✅종결 / tierB2=B후속 5콜 ✅종결 / tierB3=B-1직전 3콜 ✅종결 / tierB4=깊이재측정 3콜 ✅종결 / tierD=공시지연·grades파라미터 4콜 ✅종결 / all=30콜)"
        type: choice
        options:
          - tierE
          - tierA
          - tierB
          - tierB2
          - tierB3
          - tierB4
          - tierD
          - all
        default: tierE

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # fmp_http 를 안 쓰므로 requests 만 있으면 된다.
      - name: 📦 의존성
        run: pip install requests

      # ── 임포트 스모크 (콜 0) ──────────────────────────────────────────
      # 2026-08-22: _DETAIL 이 아래에 정의된 렌더러를 참조해 NameError 로 죽었다.
      # **ast.parse 와 check_py311 은 둘 다 통과했다** — 문법은 멀쩡했고 모듈
      # 최상단을 아무도 실행하지 않았기 때문이다. 여기서 실제로 임포트한다.
      # FMP_API_KEY 를 주지 않으므로 네트워크는 만지지 않는다(main 미실행).
      - name: 🧪 임포트 스모크 (콜 0)
        run: |
          python -c "import sys; sys.path.insert(0,'automation'); import diag_fmp_newcaps; print('import OK')"

      - name: 🔬 미사용 엔드포인트 실측
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PROBE_TIER: ${{ inputs.tier }}
        run: python automation/diag_fmp_newcaps.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/diag_fmp_newcaps.py
