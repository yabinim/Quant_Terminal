name: 🔬 진단 — economic-indicators 창·이름 실측 (수동 전용)

# 왜 있나:
#   2026-09-04 매크로 대시보드 실측에서 `economic-indicators` 를 쓰는 지표
#   둘만 낡았다.
#     GDP 성장률 QoQ   N/A   $31,423B (2025-10-01)  ← prev 없음
#     소매판매 MoM     +0.06%      (2025-12-01)     ← prev 있음
#   나머지(금리차·VIX·WTI·DXY·ERP)는 다른 엔드포인트이고 값이 현재다.
#
#   app.py 는 `name` 만 보내고 `from`/`to` 를 안 보낸다. api-docs 는 둘 다
#   지원한다고 적어놨다. 하지만 그게 원인이라는 건 아직 **가설**이다.
#   같은 무창 호출인데 GDP 는 prev 가 없고 retailSales 는 있다 —
#   "무창이면 1건" 이라는 단순 설명으로는 이 차이가 설명되지 않는다.
#
# ⚠️ 왜 고치기 전에 재나:
#   `historical-price-eod` 의 `limit=` 이 조용히 무시되던 사고가 선례다.
#   그때 옛 limit 값을 봉 수로 그대로 이식했다가 전부 다시 뜯었다.
#   추측으로 창을 정하면 같은 실수를 반복한다.
#
# ⚠️ 판정 기준 (레코드 수가 아니다):
#   W3/W6 은 기본 응답과 **겹칠 수 없는 2023년 창**을 요청한다.
#   2023년 날짜가 돌아오면 파라미터는 확실히 먹은 것이다 — 그것 말고는
#   설명이 없다. 레코드 수는 "창을 넣었더니 늘었다" 처럼 보여도 기본
#   응답이 원래 그만큼이었을 가능성을 배제하지 못한다.
#
# ⚠️ N 티어에는 양성대조가 들어 있다:
#   app.py 는 `federalFundsRate` 를 쓰는데 api-docs 목록에는 `federalFunds`
#   만 있다. 그런데 무효 이름에 FMP 가 빈 배열 200 을 준다면
#   "200 이니까 유효" 는 틀린 추론이다. `__NOPE__` 로 그것부터 확인한다.
#
# 콜 예산:
#   W (창)      6콜  ← 지금 열려 있는 질문
#   N (이름)    4콜
#   S (나머지)  3콜
#   all        13콜  (기본값)

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "티어 (all=13콜 권장 / W=창 6콜 / N=이름 4콜 / S=나머지지표 3콜)"
        type: choice
        options:
          - all
          - W
          - N
          - S
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: pip install requests

      # ── 임포트 스모크 (콜 0) ──────────────────────────────────────────
      # 2026-08-22 선례: _DETAIL 이 아래에 정의된 렌더러를 참조해 NameError 로
      # 죽었는데 ast.parse 와 check_py311 은 둘 다 통과했다 — 문법은 멀쩡했고
      # 모듈 최상단을 아무도 실행하지 않았기 때문이다. 여기서 실제로 임포트한다.
      # FMP_API_KEY 를 주지 않으므로 네트워크를 만지지 않는다(키 없으면 즉시 종료).
      - name: 🧪 임포트 스모크 (FMP 콜 0)
        run: |
          python -c "import diag_econ_indicators" && echo "임포트 OK"
          python diag_econ_indicators.py && echo "키 없이 종료 경로 OK" || \
            echo "키 없음 종료(exit 1) — 정상"

      - name: 🔬 실측
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PROBE_TIER: ${{ inputs.tier }}
        run: python diag_econ_indicators.py
