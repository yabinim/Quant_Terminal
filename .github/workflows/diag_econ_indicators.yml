name: 🔬 진단 — economic-indicators 창·이름 실측 (수동 전용)

# v1(2026-09-04 18:38) 실측으로 밝혀진 것:
#   ✅ from/to 는 먹는다 — retailSales 2023창이 2023-11·12 만 돌려줬다.
#   ✅ 그런데 응답이 1~3건으로 잘린다. 창 길이와 건수가 비례하지 않는다.
#   ✅ **무창 응답이 낡았다** — 3년창은 2026-07-01(현재), 무창은 2025-12.
#   ✅ GDP 는 정반대 — 무창 1건 / 3년창 0건 / 2023창 0건.
#   ✅ federalFundsRate 는 무효(무효 이름 __NOPE__ 와 동일 거동).
#      문서에 있는 federalFunds 는 3건 정상.
#   ✅ CPI 2건·unemploymentRate 2건 — app.py 요구 14·15건에 못 미친다.
#      두 함수의 FMP 분기는 한 번도 채택된 적 없는 죽은 코드다.
#
# ⚠️ v1 은 판정 한 줄이 틀렸다:
#      "양성대조(__NOPE__): 응답 없음 → 무효 이름은 비200"
#    실제 status 는 **200** 이었다(본문이 JSON 이 아니라 파싱만 실패).
#    실패 신호로 None 을 쓰다가 '200+파싱실패' 를 '비200' 으로 읽었다.
#    v2 는 status 를 직접 인용하고 200+빈배열 / 200+파싱실패 / 비200 을
#    절대 한 값으로 뭉개지 않는다.
#
# v2 가 푸는 질문:
#   G) GDP 를 살릴 창 모양이 있는가 — 없으면 FRED 폴백이 답이다.   7콜
#   R) 창 길이 ↔ 건수 관계. MoM 에 필요한 연속 2개월은 어떤 창?     5콜
#   C) CPI·실업률·federalFunds 도 최근 창이면 현재값이 오는가?      3콜
#   ────────────────────────────────────────────────────────────
#   all                                                          15콜
#
# ⚠️ 왜 또 재나 (바로 안 고치나):
#   `historical-price-eod` 의 `limit=` 이 조용히 무시되던 사고가 선례다.
#   지금 아는 것만으로 창을 붙이면 GDP 는 0건인 채로 남고, retailSales 는
#   어떤 창이 연속 2개월을 주는지 모르는 채로 추측이 들어간다.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "티어 (all=15콜 권장 / G=GDP구제 7콜 / R=창↔건수 5콜 / C=CPI·실업률·fedfunds 3콜)"
        type: choice
        options:
          - all
          - G
          - R
          - C
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: pip install requests

      # ── 파일 존재 확인 (콜 0) ─────────────────────────────────────────
      # ⚠️ 2026-09-04: 이 관문이 없어서 첫 실행이 헛돌았다. 스크립트는
      #    automation/ 에 있는데 워크플로가 루트에서 불렀다. 그런데 그때
      #    스모크 스텝이 `|| echo "정상"` 으로 되어 있어서 **파일 없음(exit 2)을
      #    키 없음(exit 1)으로 뭉개고 초록불을 냈다.** 잘못된 이유로 통과한
      #    테스트다. 경로부터 명시적으로 확인한다.
      - name: 📁 스크립트 존재 확인
        run: test -f automation/diag_econ_indicators.py

      # ── 임포트 스모크 (콜 0) ──────────────────────────────────────────
      # 2026-08-22 선례: _DETAIL 이 아래에 정의된 렌더러를 참조해 NameError 로
      # 죽었는데 ast.parse 와 check_py311 은 둘 다 통과했다 — 문법은 멀쩡했고
      # 모듈 최상단을 아무도 실행하지 않았기 때문이다. 여기서 실제로 임포트한다.
      - name: 🧪 임포트 스모크 (FMP 콜 0)
        run: |
          python -c "import sys; sys.path.insert(0,'automation'); import diag_econ_indicators; print('import OK')"

      # 키 없이 돌렸을 때 **정확히 exit 1** 인지 본다. `|| echo 정상` 을 쓰지
      # 않는 이유: 그러면 2(파일 없음)도 127(파이썬 없음)도 전부 '정상'이 된다.
      - name: 🧪 키 없음 경로 (FMP 콜 0)
        run: |
          set +e
          python automation/diag_econ_indicators.py
          rc=$?
          set -e
          echo "exit=$rc"
          test "$rc" -eq 1

      - name: 🔬 실측
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PROBE_TIER: ${{ inputs.tier }}
        run: python automation/diag_econ_indicators.py
