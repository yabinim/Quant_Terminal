name: 🔬 진단 — Track C 크레딧 게이트 Phase 0 데이터 프로브 (수동 전용)

# 언제 쓰나:
#   SATELLITE_MANDATE §3 시장 필터(SPY < 자기 200일선)에 크레딧 스프레드
#   (FRED BAMLH0A0HYM2, ICE BofA US High Yield OAS)를 OR 축으로 추가하는 것이
#   애초에 의미가 있는지 — 신용시장이 주가보다 먼저 무너지는지를 결합 문턱을
#   정하기 전에 데이터로만 확인한다. 가설 검증이 아니라 이 후보가 Phase 1
#   사전 약정으로 넘어갈 자격이 있는지를 잰다.
#
#   판독 기준([C-COVER]·[C-LEAD]·[C-NOISE]·[C-LAG-DATA]·[C-DECIDE])은 스크립트
#   docstring 에 **실행 전** 기록돼 있다.
#
# 안전성:
#   · 수익률 계산 0 — SPY·OAS 모두 이동평균 "교차 날짜"만 비교한다
#   · 시트 읽기/쓰기 0 — 콘솔 출력뿐, 유니버스 조회도 하지 않는다
#   · 이메일 없음 · 신규 매수·매도·알림 상태 머신 미접촉
#   · SPY(FMP 1콜) + OAS(FRED 1콜) = 총 2콜. fmp_http 경유 — A1 래칫 기준선 불변
#
# ⚠️ repository_dispatch / schedule 없음 — 일회성 프로브가 매일 콜을 태우면 안 된다.

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "1 이면 합성 셀프테스트만 실행 — 네트워크 콜 0"
        required: false
        default: "0"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas pytz fredapi

      # ── 임포트 스모크 (콜 0) ──────────────────────────────────────────
      # 이 프로브는 diag_momentum_deep_ref 를 임포트한다(find_episodes 재사용,
      # 재구현 금지). 그쪽이 깨져 있으면 여기서 먼저 시끄럽게 죽는다 —
      # 락스텝의 관문이다.
      - name: 🧪 임포트 스모크 (콜 0)
        run: |
          python -c "import sys; sys.path.insert(0,'automation'); import diag_credit_gate_probe; print('import OK')"

      # ── 셀프테스트는 늘 돈다 (콜 0) ───────────────────────────────────
      # 게이트가 죽어 있으면 프로브가 초록불로 거짓 통과를 만든다. pandas
      # bool-shift 함정 회귀(T1)를 포함한 5항목을 합성 데이터로 먼저 확인한다.
      - name: 🧬 셀프테스트 5항목 (콜 0)
        env:
          SELFTEST: "1"
        run: python automation/diag_credit_gate_probe.py

      - name: 🔬 크레딧 게이트 데이터 프로브 (읽기 전용)
        if: ${{ inputs.selftest != '1' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python automation/diag_credit_gate_probe.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/diag_credit_gate_probe.py
