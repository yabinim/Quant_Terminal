name: 🩸 진단 — 크레딧 스프레드 게이트 프로브 (**종료** · 기록 보존 · 수동 전용)

# ⚠️ **2026-09-10 종료.** 생존 후보 0. 재개하려면 새 사전 약정을 먼저 걸어야 한다.
#    종료 근거는 P5 가 아니라 **전제 붕괴**다 — BAA10Y 19.7년·짝 30~60개에서
#    리드/래그가 전부 0 또는 음수였다(신용은 먼저 조이지 않는다).
#    이 워크플로는 지우지 않고 남긴다. 대화에만 있으면 6개월 뒤에 같은 아이디어가
#    다시 제안된다. 실행은 여전히 무해하다(읽기 전용).
#    전체 실측은 스크립트 상단 'v2 실측 기록'에 박제돼 있다.
#
# 무엇을 재는가  [v2 — 2026-09-10]
# ─────────────
#   Q1 FMP 창이 ~1,254봉 밖으로 나가나 + 단일 장기 호출(D3)   → 평가 구간 확정(P2)
#   Q2 HY OAS / BAA10Y 이력이 얼마나 오나 (명시 start 포함)    → 실패면 무효(P4)
#   Q3 룰 후보 4종 심사                                        → P5 · P6 · P1
#
# v1(2026-09-10 06:02) 은 P1~P4 를 전부 통과시켰지만 **통과가 정보를 주지 않았다.**
#   A) 소스 선택 버그 — Q1 이 "2007~ 확정"이라 찍고도 main() 이 행 수가 가장 많은
#      응답(2021-09~)을 골랐다. 실측이 2021년부터 돌았다.
#   B) 병목이 FMP 가 아니라 FRED — BAMLH0A0HYM2 가 786점 / 2023-09-11~ 만 왔다.
#      워밍업까지 빼면 551봉 · SPY200 하락 국면 3회. "한두 사건에서 나온 숫자".
#   C) R1 이 애초에 게이트가 아니었다 — off **36.1%** · 16에피소드
#      (SPY200 은 10.0% · 3에피소드). "자기 20일선 위"는 평균회귀 오실레이터라
#      어떤 시계열에서도 절반쯤 참이다. Q4 의 "안정성 통과"가 이를 확증했다 —
#      10/20/30/50일이 전부 34.8~40.8%였다. **창을 바꿔도 비율이 안 변하는 건
#      튼튼하다는 뜻이 아니라 신호가 창과 무관한 잡음이라는 뜻이다.**
#   v1 실측 전체는 스크립트 상단 "v1 실측 기록"에 박제돼 있다. 지우지 않는다.
#
# ⚠️ C 의 수정은 **재협상이 아니다.** "P1 이 0.85 나왔으니 선을 0.90 으로 옮기자"
#    가 재협상이다. off 36% 는 수익률이 아니라 구조이고 결과를 보기 전에 알 수
#    있었다. 대신 새 룰은 새 사전 약정(P5·P6)을 받았고, 그 숫자는 이번 실행
#    **전에** 스크립트에 박혔다.
#
# ⚠️ **생존자 중에서 고르지 않는다.** P5·P6·P1 을 통과한 후보는 전부 Phase 1
#    백테스트로 넘긴다. 여기서 최고를 고르면 심사에 쓴 데이터로 선택까지 하는
#    것이고, 그건 T6 과 같은 함정이다.
#
# ⚠️ '탈락'과 '판정불가'는 다르다. 판정불가는 **데이터가 짧다**는 뜻이지 룰이
#    틀렸다는 뜻이 아니다. 요약 블록에서 둘을 섞어 읽지 말 것.
#
# ⚠️ 여전히 **수익률을 재지 않는다.** P5 는 "게이트의 모양인가"만 묻는다.
#    "값을 하는가"는 Phase 1 이다.
#
# 안전성: **읽기 전용.** 시트를 열지 않고 파일을 쓰지 않는다. 그래서 GSPREAD_KEY 가
#         env 에 없다 — 키가 없으면 실수로도 쓸 수 없다. 몇 번을 돌려도 부작용이 없다.
#
# 콜 예산: FMP 4콜(SPY 창 4종) + FRED 5콜. 다른 워크플로와 겹쳐 돌려도 무방한
#         유일한 진단이다 — 분당 한도에 사실상 영향이 없다.

on:
  workflow_dispatch:        # 수동 실행만. 스케줄러/repository_dispatch 트리거 없음.

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # 실측 9콜 — 보통 1분 미만. 여유는 FRED 지연용.

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # gspread·google-auth 없음 — 이 프로브는 시트를 만지지 않는다.
      # fredapi 는 Q2/Q3 에 필수다(없으면 Q2 가 [X] 로 끝난다).
      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas pytz fredapi

      # 락스텝 짝. 배선이 깨진 상태로 나온 숫자는 어차피 못 믿는다.
      # 이 프로브는 fmp_extras(창 정책) · fmp_http(A1 경유)를 import 한다.
      - name: 🛡️ FMP SSOT · 튜플 계약 가드 (락스텝)
        run: python automation/diag_fmp_ssot.py

      # ⚠️ 실측 **전에** 돌린다. 후보 넷 중 하나만 부등호가 뒤집혀도 그 후보는
      #    조용히 역방향으로 돌고, 표에서는 'off 비율이 좀 다른 줄'로만 보인다.
      #    자체검증 29개는 변이 14종으로 죽음이 확인된 것이다 —
      #    후보 4종 부등호 · C3 속도/창 · P5 경계 양쪽(36% 회귀 앵커 포함) ·
      #    P6 · P1 · 확인일 · Jaccard 퇴화 · 결측 처리 · 리드/래그 부호.
      #    스크립트 안에서도 한 번 더 부르고 실패 시 실측을 읽지 않는다 —
      #    로컬 실행에도 같은 보호가 걸리게 하기 위해 이중으로 둔다.
      - name: ✅ 게이트 로직 자체검증 (합성 데이터 · 네트워크 불필요)
        run: python automation/diag_credit_gate_probe.py --selftest

      - name: 🩸 크레딧 게이트 프로브 (읽기 전용 · 시트 접촉 0 · 파일 쓰기 0)
        env:
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # FMP Starter 한도는 분당 300. 67% 로 둔다(다른 진단과 동일 규약).
          FMP_RATE_LIMIT_PER_MIN: '200'
        run: |
          python automation/diag_credit_gate_probe.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          automation/diag_credit_gate_probe.py
