name: 🧪 회귀 — 시작 페이지 + 실적 레이더 지연 계산

# app.py 를 소스로 검사한다(streamlit 없이 import 할 수 없으므로).
# 네트워크·시트 접근 없음.
#
# 무엇을 지키나:
#   1. 메뉴 인덱스 밀림
#      _MAIN_NAV_OPTIONS 중간에 항목을 끼우면 _MAIN_NAV_OPTIONS[n] 분기가
#      전부 한 칸씩 밀려 엉뚱한 페이지가 열린다.
#      새 항목은 맨 뒤 append, 표시 순서만 _nav_opts 에서 재배치.
#   2. 시작 페이지가 무거워짐
#      착지 지점을 옮긴 이유가 사라진다. DRG 계산·가격 이력·포트폴리오 로드가
#      _render_home 안에 들어오면 실패한다.
#   3. 정의보다 앞선 사용
#      _pv_f/_pv_money 는 원래 실적 섹션 안의 중첩 함수였다. 지연 게이트에서
#      쓰려다 NameError 를 낼 뻔했다 — 모듈 레벨 + 정의가 사용보다 앞.
#   4. 지연 게이트 캐시 키 결함
#      키에 날짜·종목집합이 빠지면 종목을 추가해도 어제 판정이 남는다.
#      낡은 판정은 없는 판정보다 위험하다.
#
# 변이 테스트로 확인했다 — 메뉴 중간 삽입 / 시작 페이지에 load_portfolio 추가 /
# 캐시 키에서 날짜 제거, 셋 다 실제로 실패한다.

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'automation/diag_startup.py'
  pull_request:
    paths:
      - 'app.py'
      - 'automation/diag_startup.py'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 의존성 없음 — ast/re 만 쓴다. streamlit 설치는 불필요하고 느리다.
      - name: 🧪 시작·지연계산 회귀
        run: python automation/diag_startup.py

      - name: ✅ Python 3.11 문법 호환성
        run: python check_py311.py app.py automation/diag_startup.py
