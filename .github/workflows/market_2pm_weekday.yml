name: ⏱️ 2PM 장중 워치리스트 헤드업 (잠정)

on:
  repository_dispatch:
    types: [trigger-2pm-weekday]   # Cloud Scheduler가 보내는 event_type과 일치 (평일 2PM ET)
  workflow_dispatch:

jobs:
  run-2pm-intraday:
    runs-on: ubuntu-latest
    # 2026-08-26: 15 → 20. run_watchlist_alerts 가 fmp_http 를 거치게 되면서
    # 실패한 호출마다 재시도 백오프(2+4+8초 + 지터)가 붙는다. 장중 경로는
    # 히스토리 + quote 로 약 180콜이라, 10종목이 실패하면 3분이 추가된다.
    # 재시도를 줄이는 대신 예산을 늘렸다 — 조용히 종목을 잃는 쪽이 더 나쁘다.
    timeout-minutes: 20

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-auth \
            gspread \
            requests \
            numpy \
            pandas \
            pytz

      - name: ⏱️ 워치리스트 장중 헤드업 (regime_core, --mode intraday)
        env:
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
          # FMP Starter 는 분당 300. 67% 로 둔다. 이 잡의 실측 호출량(약 180)은
          # 한도 아래지만, 다른 워크플로와 같은 분에 겹치면 계정 단위로 합산된다.
          # ⚠️ 300 으로 올리지 말 것 — 한도에 붙이면 429 가 난다.
          FMP_RATE_LIMIT_PER_MIN: '200'
        run: |
          python automation/run_watchlist_alerts.py --mode intraday

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "2PM 장중 헤드업 완료 (UTC): $(date -u)"
          echo "======================================"
