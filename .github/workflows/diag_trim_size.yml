name: 🔬 진단 — 트랜치 매도 사이징 검증 (수동 전용)

# 언제 쓰나:
#   regime_core 의 trim_size_plan / resolve_swing_weight /
#   default_events_for_weight / verdict_action 이나 accounts_core 의
#   Swing_Weight_Pct·Trim_Ratio_Pct 파싱을 건드린 직후, 배포 전.
#
# 무엇을 검사하나 (48항목):
#   A 미설정 보호 — None 과 0 의 구분, 상속 우선순위, 범위 클램프
#   B 수량 계산   — 0:100 / 100:0 / 50:50 / 트림폭 / 소수점 주식
#   C 금액 게이트 — 부분 축소만 차단, 전량 청산은 면제
#   D 기본 이벤트 — 비율에서 파생, 명시 states 우선, 'none' 보존
#   E 라벨 분류   — '줄이기 (일부 청산)' 판별 케이스 포함
#   F 파싱 왕복   — accounts_core 저장/복원
#   G 양성 대조
#
#   ⚠️ 로직을 복사하지 않는다. regime_core / accounts_core 의 실제 함수를
#      호출한다. 패치 전 모듈에 물리면 AttributeError 로 죽는다.
#
#   ⚠️ E-5/E-7 은 판별 케이스다. verdict_action 을 부분 문자열 검색으로
#      되돌리면 이 둘만 실패한다. 초안이 실제로 이 결함을 갖고 있었고
#      돌연변이 시험에서 처음엔 잡히지 않았다 — 지우지 말 것.
#
# 안전성:
#   · 네트워크·시트·FMP·메일 접근 전부 없음 · 시크릿 불필요 · 부작용 없음

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성
        run: |
          pip install --upgrade pip
          pip install numpy pandas

      - name: 🔬 트랜치 사이징 회귀 + 양성대조
        run: python automation/diag_trim_size.py

      - name: ✅ Python 3.11 문법 호환성
        run: >
          python check_py311.py
          regime_core.py
          accounts_core.py
          automation/run_watchlist_alerts.py
          automation/diag_trim_size.py
