name: 📊 5PM After-Close 평일 (내러티브 + DRG 검증 + 워치리스트 알림)

on:
  repository_dispatch:
    types: [trigger-5pm-weekday]   # Cloud Scheduler가 보내는 event_type과 일치시킴
  workflow_dispatch:
  # schedule 제거: GitHub Actions 자체 스케줄 비활성화

jobs:
  run-5pm-weekday:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            fredapi

      - name: 📰 시장 내러티브 생성 (After-Close)
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_narrative.py

      - name: ⏳ 30초 대기
        run: sleep 30

      - name: ✅ DRG 예측 결과 검증
        env:
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_drg_verify.py

      - name: ⏳ 15초 대기
        run: sleep 15

      # ⚠️ 워치리스트 알림보다 **먼저** 실행해야 한다.
      #    실적 진입 차단 게이트가 Earnings_Events 시트를 공유 상태로 쓰므로,
      #    스냅샷이 먼저 기록돼야 당일 D-3 종목이 곧바로 차단된다.
      - name: 📅 실적 레이더 (사전 게이트 + 발표 후 측정)
        env:
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_earnings_watch.py

      - name: ⏳ 15초 대기
        run: sleep 15

      - name: 🔔 워치리스트 레짐/타이밍 알림 (regime_core 엔진, app.py와 lockstep)
        env:
          FMP_API_KEY:       ${{ secrets.FMP_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_watchlist_alerts.py

      # ── 업종 성과 스냅샷 (일 1콜) ────────────────────────────────────────
      # Phase 3 정밀진단의 '업종 백분위' 표시용 데이터를 하루 1행씩 쌓는다.
      #
      # 왜 스냅샷을 쌓나: industry-performance-snapshot 은 **하루치 변화율**이라
      # 그것만으로 149개를 줄 세우면 잡음이다("상위 8%"가 내일 "하위 30%").
      # 20일·120일 모멘텀이 필요한데 매일 API 로 받으면 149콜/일이 든다.
      # 한 번 백필해 두면 이후 유지비가 하루 1콜이다.
      #
      # ⚠️ 최초 1회 refresh_industry_perf.py --backfill 을 수동 실행해야 한다.
      #    시트가 없으면 이 스텝은 ABORT 로 안내만 하고 끝난다(실패 아님).
      #
      # if: always() + continue-on-error — 앞 스텝이 실패해도 독립적으로 돌고,
      # 이 스텝이 실패해도 알림 경로에 아무 영향이 없으므로 워크플로를
      # 실패시키지 않는다. 표시 데이터가 하루 낡을 뿐이다.
      - name: 🏭 업종 성과 스냅샷 (일 1콜)
        if: always()
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/refresh_industry_perf.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "5PM 평일 자동화 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
