# cron refresh 2026-05-25
name: 📊 5PM After-Close 평일 (내러티브 + DRG 검증)

on:
  schedule:
    # 평일 5PM ET = UTC 21:00 (서머타임: UTC 20:00)
    # → 보수적으로 21:00 UTC 사용
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-5pm-weekday:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install \
            google-genai \
            google-auth \
            gspread \
            feedparser \
            requests \
            numpy \
            pandas \
            pytz \
            yfinance \
            fredapi

      - name: 📰 시장 내러티브 생성 (After-Close)
        env:
          GOOGLE_API_KEY:    ${{ secrets.GOOGLE_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_narrative.py

      - name: ⏳ 30초 대기
        run: sleep 30

      - name: ✅ DRG 예측 결과 검증
        env:
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:          ${{ secrets.GMAIL_TO }}
          GSPREAD_KEY:       ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/run_drg_verify.py

      - name: 📋 실행 로그 요약
        if: always()
        run: |
          echo "======================================"
          echo "5PM 평일 자동화 완료"
          echo "실행 시각 (UTC): $(date -u)"
          echo "======================================"
