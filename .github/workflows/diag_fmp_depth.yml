name: 🔍 진단 — FMP 이력 깊이 (수동 전용)

on:
  workflow_dispatch:        # 수동 실행만. 스케줄러/디스패치 트리거 없음.

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # 읽기 전용 진단 — 보통 1~2분

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install google-auth gspread requests numpy pandas pytz

      - name: 🔍 FMP 이력 깊이 진단 (읽기 전용 · 시트 기록 없음)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GSPREAD_KEY: ${{ secrets.GSPREAD_KEY }}
        run: |
          python automation/diag_fmp_depth.py
